name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: pharmacare
  INSTANCE_ID: i-01b189297307086ee
  AWS_ROLE_ARN: arn:aws:iam::564580818691:role/pharmacare-github-actions-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python manage.py test
        env:
          SECRET_KEY: ci-test-key

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy new image on EC2 via SSM and run migrations
        run: |
          IMAGE_TAG="${{ steps.build.outputs.image_tag }}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/' /opt/pharmacare/.env\",\"cd /opt/pharmacare && aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}\",\"cd /opt/pharmacare && docker compose pull app\",\"cd /opt/pharmacare && docker compose up -d app\",\"cd /opt/pharmacare && for i in 1 2 3 4 5 6; do docker compose exec -T app python manage.py migrate --noinput && break || sleep 5; done\",\"sleep 3\",\"docker compose -f /opt/pharmacare/docker-compose.yml --project-directory /opt/pharmacare exec -T app curl -s -o /dev/null -w HEALTHZ_%{http_code} http://localhost:8000/healthz/\"]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" --output text)

          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text)
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ]; then break; fi
            sleep 5
          done

          OUTPUT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text)
          ERR=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardErrorContent" --output text)
          echo "$OUTPUT"
          echo "$ERR"

          if [ "$STATUS" != "Success" ] || ! echo "$OUTPUT" | grep -q "HEALTHZ_200"; then
            echo "Deployment failed or health check did not return 200"
            exit 1
          fi
          echo "Deployment succeeded, health check OK"
